[package]
name = "mytthy"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
toml = "1"
vte4 = { version = "0.10", features = ["gtk_v4_18", "v0_78"], optional = true }

[features]
default = ["gtk-frontend"]
gtk-frontend = ["dep:vte4"]

[[bin]]
name = "mytthy"
required-features = ["gtk-frontend"]
